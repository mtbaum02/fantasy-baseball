name: Refresh Fantasy Stats

on:
  schedule:
    # 7:00 AM Eastern = 11:00 AM UTC (adjust for daylight saving if needed)
    - cron: '0 11 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch last-updated timestamp
        run: |
          echo "{\"updated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > last-updated.json

      - name: Commit timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-updated.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh stats $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
